<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIN FUTURES | 해외선물 시장분석 · 듀얼 헤지 전략 블로그</title>
<meta name="description" content="15년 경력 해외선물 트레이더 WIN FUTURES의 시장분석, 트레이딩 칼럼, 듀얼 포지션 헤지 시스템 이야기.">
<meta property="og:title" content="WIN FUTURES | 해외선물 시장분석 블로그">
<meta property="og:description" content="15년 경력 해외선물 트레이더의 시장분석과 헤지 전략 칼럼.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://winfutures-blog.vercel.app/">
<link rel="canonical" href="https://winfutures-blog.vercel.app/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17171A;
    --surface: #1F1F23;
    --surface-hover: #262629;
    --border: #2C2C30;
    --gold: #CC6A1E;
    --gold-dim: #8C4A1E;
    --text: #E8E6E1;
    --text-secondary: #9C9A94;
    --text-muted: #6B6A65;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
  }
  .layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    max-width: 1100px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* ===== Left nav ===== */
  .nav {
    width: 220px;
    flex-shrink: 0;
    padding: 20px 12px;
    position: sticky;
    top: 0;
    height: 100vh;
    border-right: 1px solid var(--border);
    text-align: right;
  }
  .nav-logo .dot { color: var(--gold); }
  .nav-item {
    display: flex; align-items: center; justify-content: flex-end; gap: 14px;
    padding: 12px;
    border-radius: 8px;
    font-size: 16px;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
  }
  .nav-item:hover { background: var(--surface-hover); }
  .nav-item.active { color: var(--gold); font-weight: 500; }
  .nav-icon { width: 20px; text-align: center; font-size: 16px; }
  .nav-write {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
    margin-left: auto;
    padding: 6px 12px;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.3px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    box-sizing: border-box;
  }
  .nav-write:hover { background: rgba(198,161,91,0.08); border-color: var(--gold); }
  .side-actions { display: flex; gap: 10px; margin-bottom: 16px; }
  .side-btn {
    flex: 1;
    text-align: center;
    padding: 10px;
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    color: var(--gold);
    font-size: 13px;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
  }
  .side-btn:hover { background: rgba(204,106,30,0.08); border-color: var(--gold); }
  .side-btn-primary { background: rgba(204,106,30,0.1); }

  .nav-profile {
    padding: 4px 4px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .nav-profile .name-row { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; }
  .nav-profile .badge {
    display: inline-flex; align-items: center; font-size: 10px; color: var(--gold);
    border: 1px solid var(--gold-dim); padding: 1px 6px; border-radius: 3px;
  }
  .nav-profile .handle { color: var(--text-secondary); font-size: 12px; margin-top: 4px; }
  .nav-profile .bio { font-size: 12px; line-height: 1.6; margin-top: 10px; }
  .nav-profile .stats { display: flex; justify-content: flex-end; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--text-secondary); }
  .nav-profile .stats b { color: var(--text); font-weight: 500; }

  .nav-category {
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .nav-category-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 4px 8px; }
  .cat-item {
    display: flex; justify-content: flex-end; align-items: center; gap: 10px;
    padding: 8px 8px; border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  .cat-item:hover { background: var(--surface-hover); }
  .cat-item.active { color: var(--gold); }
  .cat-count { color: var(--text-muted); font-size: 12px; }
  .nav-photo, .cover { display: block; text-decoration: none; }
  .nav-photo {
    margin-top: 0;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .nav-photo img { width: 100%; display: block; }
  .nav-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 12px 4px 4px;
    letter-spacing: 0.3px;
    text-align: right;
  }

  /* ===== Center feed ===== */
  .feed { width: 600px; flex-shrink: 0; border-right: 1px solid var(--border); }
  .cover {
    height: 160px;
    background: var(--surface) url('banner.png') center center / cover no-repeat;
    border-bottom: 1px solid var(--border);
  }
  .profile { padding: 16px 24px 20px; border-bottom: 1px solid var(--border); }
  .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--bg);
    margin-top: -36px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 20px; color: var(--gold);
  }
  .name-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; }
  .badge {
    display: inline-flex; align-items: center; font-size: 11px; color: var(--gold);
    border: 1px solid var(--gold-dim); padding: 2px 8px; border-radius: 3px;
  }
  .handle { color: var(--text-secondary); font-size: 14px; margin-top: 2px; }
  .bio { font-size: 14px; line-height: 1.6; margin-top: 12px; }
  .bio .accent { color: var(--gold); }
  .stats { display: flex; gap: 20px; margin-top: 14px; font-size: 13px; color: var(--text-secondary); }
  .stats b { color: var(--text); font-weight: 500; }

  .filters { display: flex; border-bottom: 1px solid var(--border); }
  .filter {
    flex: 1; text-align: center; padding: 14px 0; font-size: 14px;
    color: var(--text-secondary); cursor: pointer; position: relative;
  }
  .filter:hover { color: var(--text); background: var(--surface-hover); }
  .filter.active { color: var(--text); font-weight: 500; }
  .filter.active::after {
    content: ''; position: absolute; bottom: -1px; left: 50%;
    transform: translateX(-50%); width: 32px; height: 2px; background: var(--gold);
  }

  .post { padding: 18px 24px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
  .post:hover { background: var(--surface-hover); }
  .post-tag { display: inline-block; font-size: 11px; color: var(--gold); border-left: 2px solid var(--gold); padding-left: 6px; margin-bottom: 8px; }
  .post-tag.column { color: #9C9A94; border-left-color: #6B6A65; }
  .post-tag.notice { color: #C48A6A; border-left-color: #8C5C42; }
  .post-tag.archive { color: #8FA8C4; border-left-color: #5C7A99; }
  .post-text { font-size: 15px; line-height: 1.65; white-space: pre-line; }
  .post-text strong { color: var(--gold); font-weight: 700; }
  .post-image { width: 100%; border-radius: 8px; margin: 10px 0; display: block; }
  .post-meta { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--text-muted); }
  .post-edit-link { margin-left: auto; color: var(--text-muted); text-decoration: none; }
  .post-edit-link:hover { color: var(--gold); }
  .post.hidden { display: none; }

  /* ===== Right sidebar ===== */
  .side { width: 280px; flex-shrink: 0; padding: 20px 16px; }
  .search-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search-box:focus-within {
    border-color: var(--gold-dim);
    box-shadow: 0 0 0 3px rgba(204,106,30,0.12);
  }
  .search-icon { color: var(--gold); font-size: 15px; }
  .search-box input {
    background: none; border: none; outline: none; color: var(--text);
    font-family: 'Noto Sans KR', sans-serif; font-size: 14px; width: 100%;
    letter-spacing: 0.2px;
  }
  .search-box input::placeholder { color: var(--text-muted); }
  .side-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .side-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 12px; }
  #tagsArea { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-item {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border);
    font-size: 11px; cursor: pointer;
  }
  .tag-item:hover { border-color: var(--gold-dim); }
  .tag-item:hover .tag-name { color: var(--gold); }
  .tag-item.active { border-color: var(--gold); background: rgba(204,106,30,0.1); }
  .tag-item.active .tag-name { color: var(--gold); }
  .tag-name { color: var(--text); }
  .tag-count { color: var(--text-muted); font-size: 10px; }

  .poster-banner {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .poster-banner { cursor: pointer; transition: opacity 0.15s; }
  .poster-banner:hover { opacity: 0.85; }
  .poster-banner img { width: 100%; display: block; }

  .signature { display: flex; justify-content: center; padding: 20px 0; gap: 6px; }
  .signature span { width: 4px; height: 4px; border-radius: 50%; background: var(--gold-dim); }
</style>
</head>
<body>

<div class="layout">

  <!-- LEFT NAV -->
  <div class="nav">
    <a href="index.html"><div class="nav-photo"><img src="logo.png" alt="WIN FUTURES"></div></a>
    <div class="nav-logo">WIN FUTURES ARCHIVE</div>
    <div class="nav-profile" id="profileArea"></div>
    <div class="nav-category" id="categoryArea"></div>
  </div>

  <!-- CENTER FEED -->
  <div class="feed">
    <a href="index.html"><div class="cover"></div></a>

    <div class="filters">
      <div class="filter active" data-cat="all">전체</div>
      <div class="filter" data-cat="notice">필독해주세요</div>
      <div class="filter" data-cat="community">커뮤니티안내</div>
      <div class="filter" data-cat="review">트레이딩리뷰</div>
      <div class="filter" data-cat="archive">자료아카이브</div>
    </div>

    <div id="postsContainer"></div>

    <div class="signature"><span></span><span></span><span></span></div>
  </div>

  <!-- RIGHT SIDEBAR -->
  <div class="side">
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="검색">
    </div>
    <div class="side-card">
      <div class="side-title">최근 태그</div>
      <div id="tagsArea"></div>
    </div>
    <div class="side-actions">
      <a class="side-btn" href="manage.html">🗑 글 관리</a>
      <a class="side-btn side-btn-primary" href="write.html">✎ 글쓰기</a>
    </div>
    <a href="poster.jpg" target="_blank">
      <div class="poster-banner" id="posterBanner">
        <img src="poster.jpg" alt="WIN FUTURES" onerror="document.getElementById('posterBanner').parentElement.style.display='none';">
      </div>
    </a>
    <a href="poster-left.jpg" target="_blank">
      <div class="poster-banner" id="navPoster">
        <img src="poster-left.jpg" alt="WIN FUTURES" onerror="document.getElementById('navPoster').parentElement.style.display='none';">
      </div>
    </a>
  </div>

</div>

<script>
  const CATEGORY_LABEL = { notice: '필독해주세요', community: '커뮤니티안내', review: '트레이딩리뷰', archive: '자료아카이브' };
  const CATEGORY_CLASS = { notice: 'notice', community: '', review: 'column', archive: 'archive' };

  function formatDate(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diffMs = now - d;
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    if (diffDays === 0) {
      return d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
    } else if (diffDays === 1) {
      return '어제';
    } else if (diffDays < 7) {
      return diffDays + '일 전';
    }
    return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
  }

  let currentCategory = 'all';
  let currentSearch = '';

  function renderPosts(posts) {
    const container = document.getElementById('postsContainer');
    container.innerHTML = posts.map(p => `
      <div class="post" data-cat="${p.category}" data-search="${escapeHtml(p.content.toLowerCase())}">
        <div class="post-tag ${CATEGORY_CLASS[p.category] || ''}">${CATEGORY_LABEL[p.category] || p.category}</div>
        ${p.image ? `<img class="post-image" src="${p.image}" alt="첨부 이미지" loading="lazy">` : ''}
        <div class="post-text">${renderBold(escapeHtml(p.content))}</div>
        <div class="post-meta"><span>${formatDate(p.date)}</span><span>· 조회 ${p.views.toLocaleString('ko-KR')}</span><a href="manage.html?edit=${p.id}" class="post-edit-link">✎ 수정</a></div>
      </div>
    `).join('');
    attachFilterLogic();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderBold(escapedText) {
    return escapedText.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function updateVisiblePosts() {
    const q = currentSearch.trim().toLowerCase();
    document.querySelectorAll('.post').forEach(p => {
      const matchesCategory = currentCategory === 'all' || p.dataset.cat === currentCategory;
      const matchesSearch = !q || p.dataset.search.includes(q);
      p.classList.toggle('hidden', !(matchesCategory && matchesSearch));
    });
  }

  function applyFilter(cat) {
    currentCategory = cat;
    document.querySelectorAll('.filter').forEach(f => f.classList.toggle('active', f.dataset.cat === cat));
    document.querySelectorAll('.cat-item').forEach(c => c.classList.toggle('active', c.dataset.cat === cat));
    updateVisiblePosts();
  }

  function attachFilterLogic() {
    document.querySelectorAll('.filter').forEach(f => { f.onclick = () => applyFilter(f.dataset.cat); });
    document.querySelectorAll('.cat-item').forEach(c => { c.onclick = () => applyFilter(c.dataset.cat); });
  }

  function renderCategoryList(posts) {
    const counts = { notice: 0, community: 0, review: 0, archive: 0 };
    posts.forEach(p => { if (counts[p.category] !== undefined) counts[p.category]++; });
    const el = document.getElementById('categoryArea');
    el.innerHTML = `
      <div class="nav-category-title">카테고리</div>
      <div class="cat-item active" data-cat="all"><span>전체</span><span class="cat-count">${posts.length}</span></div>
      <div class="cat-item" data-cat="notice"><span>필독해주세요</span><span class="cat-count">${counts.notice}</span></div>
      <div class="cat-item" data-cat="community"><span>커뮤니티안내</span><span class="cat-count">${counts.community}</span></div>
      <div class="cat-item" data-cat="review"><span>트레이딩리뷰</span><span class="cat-count">${counts.review}</span></div>
      <div class="cat-item" data-cat="archive"><span>자료아카이브</span><span class="cat-count">${counts.archive}</span></div>
    `;
  }

  function renderBio(text) {
    let escaped = escapeHtml(text);
    escaped = renderBold(escaped);
    escaped = escaped.replace(/(blog\.naver\.com\/[a-zA-Z0-9_-]+)/gi, (match) => `<a href="https://${match}" target="_blank" style="color:var(--gold);text-decoration:none;">${match}</a>`);
    escaped = escaped.replace(/(카카오\s*(?:ID|아이디)\s*[:：]?\s*)([A-Za-z0-9_.\-]+)/gi, (m, label, id) => `${label}<span style="color:var(--gold);">${id}</span>`);
    return escaped;
  }

  function renderProfile(profile, postCount) {
    const el = document.getElementById('profileArea');
    el.innerHTML = `
      ${profile.badge ? `<div class="name-row"><span class="badge">${escapeHtml(profile.badge)}</span></div>` : ''}
      ${profile.handle ? `<div class="handle">${escapeHtml(profile.handle)}</div>` : ''}
      <div class="bio">${renderBio(profile.bio).replace(/\n/g, '<br>')}</div>
      <div class="stats"><span><b>${profile.followers.toLocaleString('ko-KR')}</b> 팔로워</span><span><b>${postCount.toLocaleString('ko-KR')}</b> 게시글</span></div>
    `;
  }

  function renderTags(posts) {
    const counts = {};
    posts.forEach(p => {
      const matches = p.content.match(/#[^\s#]+/g) || [];
      matches.forEach(tag => { counts[tag] = (counts[tag] || 0) + 1; });
    });
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const el = document.getElementById('tagsArea');
    if (sorted.length === 0) {
      el.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">글에 #태그를 넣으면 여기에 자동으로 표시됩니다.</div>';
      return;
    }
    el.innerHTML = sorted.map(([tag, count]) =>
      `<div class="tag-item" data-tag="${escapeHtml(tag.slice(1))}"><span class="tag-name">${escapeHtml(tag)}</span><span class="tag-count">${count}</span></div>`
    ).join('');
    el.querySelectorAll('.tag-item').forEach(item => {
      item.onclick = () => {
        const word = item.dataset.tag;
        document.getElementById('searchInput').value = word;
        currentSearch = word;
        updateVisiblePosts();
        el.querySelectorAll('.tag-item').forEach(t => t.classList.remove('active'));
        item.classList.add('active');
      };
    });
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    document.querySelectorAll('#tagsArea .tag-item').forEach(t => t.classList.remove('active'));
    updateVisiblePosts();
  });

  Promise.all([
    fetch('./profile.json').then(r => r.json()),
    fetch('./posts.json').then(r => r.json())
  ]).then(([profile, posts]) => {
    renderProfile(profile, posts.length);
    posts.sort((a, b) => new Date(b.date) - new Date(a.date));
    renderCategoryList(posts);
    renderPosts(posts);
    renderTags(posts);
  }).catch(() => {
    document.getElementById('postsContainer').innerHTML =
      '<div class="post"><div class="post-text">글을 불러오지 못했습니다.</div></div>';
  });
</script>

</body>
</html>
