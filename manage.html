<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>글 관리 - WIN FUTURES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17171A;
    --surface: #1F1F23;
    --border: #2C2C30;
    --gold: #CC6A1E;
    --gold-dim: #8C4A1E;
    --text: #E8E6E1;
    --text-secondary: #9C9A94;
    --text-muted: #6B6A65;
    --error: #C46A6A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .wrap { width: 100%; max-width: 560px; }
  .back { color: var(--text-secondary); text-decoration: none; font-size: 14px; }
  .back:hover { color: var(--gold); }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    margin: 16px 0 24px;
  }
  h1 .dot { color: var(--gold); }

  .lock-box { text-align: center; padding: 60px 0; }
  input[type="password"] {
    width: 100%;
    max-width: 280px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    padding: 12px;
    outline: none;
    margin-bottom: 12px;
  }
  input[type="password"]:focus { border-color: var(--gold-dim); }
  button {
    padding: 11px 20px;
    background: var(--gold);
    color: #17171A;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #E08A42; }
  button:disabled { background: var(--gold-dim); cursor: not-allowed; }

  .post-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .post-tag { display: inline-block; font-size: 11px; color: var(--gold); border-left: 2px solid var(--gold); padding-left: 6px; margin-bottom: 8px; }
  .post-tag.column { color: #9C9A94; border-left-color: #6B6A65; }
  .post-tag.notice { color: #C48A6A; border-left-color: #8C5C42; }
  .post-tag.archive { color: #8FA8C4; border-left-color: #5C7A99; }
  .post-text { font-size: 14px; line-height: 1.6; white-space: pre-line; margin-bottom: 10px; }
  .post-footer { display: flex; justify-content: space-between; align-items: center; }
  .post-date { font-size: 12px; color: var(--text-muted); }
  .del-btn {
    background: transparent;
    color: var(--error);
    border: 1px solid var(--error);
    padding: 6px 14px;
    font-size: 13px;
  }
  .del-btn:hover { background: rgba(196,106,106,0.1); }
  .del-btn:disabled { opacity: 0.5; }

  #manageArea { display: none; }
  .msg { margin: 12px 0; font-size: 13px; padding: 10px; border-radius: 8px; display: none; }
  .msg.error { display: block; background: rgba(196,106,106,0.1); color: var(--error); border: 1px solid var(--error); }
  .msg.success { display: block; background: rgba(198,161,91,0.12); color: var(--gold); border: 1px solid var(--gold-dim); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 홈으로</a>
  <h1>WIN<span class="dot">·</span>FUTURES 글 관리</h1>

  <div class="lock-box" id="lockBox">
    <input type="password" id="managePassword" placeholder="비밀번호"><br>
    <button id="unlockBtn">확인</button>
    <div class="msg" id="lockMsg"></div>
  </div>

  <div id="manageArea">
    <div class="msg" id="actionMsg"></div>
    <div id="postList"></div>
  </div>
</div>

<script>
  const CATEGORY_LABEL = { notice: '필독해주세요', community: '커뮤니티안내', review: '트레이딩리뷰', archive: '자료아카이브' };
  const CATEGORY_CLASS = { notice: 'notice', community: '', review: 'column', archive: 'archive' };
  let storedPassword = '';

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderBold(escapedText) {
    return escapedText.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  async function loadPosts() {
    const res = await fetch('./posts.json?_=' + Date.now());
    const posts = await res.json();
    posts.sort((a, b) => new Date(b.date) - new Date(a.date));
    const list = document.getElementById('postList');
    if (posts.length === 0) {
      list.innerHTML = '<p style="color:var(--text-muted)">게시된 글이 없습니다.</p>';
      return;
    }
    list.innerHTML = posts.map(p => `
      <div class="post-item" data-id="${p.id}">
        <div class="post-tag ${CATEGORY_CLASS[p.category] || ''}">${CATEGORY_LABEL[p.category] || p.category}</div>
        <div class="post-text">${renderBold(escapeHtml(p.content))}</div>
        <div class="post-footer">
          <span class="post-date">${new Date(p.date).toLocaleString('ko-KR')}</span>
          <button class="del-btn" onclick="deletePost('${p.id}', this)">삭제</button>
        </div>
      </div>
    `).join('');
  }

  async function deletePost(id, btn) {
    if (!confirm('이 글을 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
    btn.disabled = true;
    btn.textContent = '삭제 중...';
    const actionMsg = document.getElementById('actionMsg');
    actionMsg.className = 'msg';

    try {
      const res = await fetch('/api/posts', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: storedPassword, id })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '삭제 실패');

      actionMsg.textContent = data.message;
      actionMsg.className = 'msg success';
      btn.closest('.post-item').remove();
    } catch (err) {
      actionMsg.textContent = err.message;
      actionMsg.className = 'msg error';
      btn.disabled = false;
      btn.textContent = '삭제';
    }
  }

  document.getElementById('unlockBtn').addEventListener('click', async () => {
    const pw = document.getElementById('managePassword').value;
    if (!pw) return;
    storedPassword = pw;
    document.getElementById('lockBox').style.display = 'none';
    document.getElementById('manageArea').style.display = 'block';
    await loadPosts();
  });
</script>
</body>
</html>
