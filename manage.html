<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>글 관리 - WIN FUTURES</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17171A;
    --surface: #1F1F23;
    --border: #2C2C30;
    --gold: #CC6A1E;
    --gold-dim: #8C4A1E;
    --text: #E8E6E1;
    --text-secondary: #9C9A94;
    --text-muted: #6B6A65;
    --error: #C46A6A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
  }
  .layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    max-width: 1100px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* ===== Left nav (동일 브랜드 틀) ===== */
  .nav {
    width: 220px;
    flex-shrink: 0;
    padding: 20px 12px;
    position: sticky;
    top: 0;
    height: 100vh;
    border-right: 1px solid var(--border);
    text-align: right;
  }
  .nav-photo { display: block; text-decoration: none; }
  .nav-photo img { width: 100%; display: block; border-radius: 10px; border: 1px solid var(--border); }
  .nav-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 12px 4px 4px;
    letter-spacing: 0.3px;
  }
  .nav-profile { padding: 4px 4px 16px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .nav-profile .name-row { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; }
  .nav-profile .badge {
    display: inline-flex; align-items: center; font-size: 10px; color: var(--gold);
    border: 1px solid var(--gold-dim); padding: 1px 6px; border-radius: 3px;
  }
  .nav-profile .handle { color: var(--text-secondary); font-size: 12px; margin-top: 4px; }
  .nav-profile .bio { font-size: 12px; line-height: 1.6; margin-top: 10px; }
  .nav-profile .bio a { color: var(--gold); text-decoration: none; }
  .nav-category { padding-bottom: 16px; }
  .nav-category-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 4px 8px; }
  .cat-item { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 6px; font-size: 14px; }
  .cat-count { color: var(--text-muted); font-size: 12px; }

  @media (max-width: 900px) {
    .layout { flex-direction: column; align-items: stretch; max-width: 100%; min-height: auto; }
    .nav { width: 100%; position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); text-align: left; }
    .nav-logo { text-align: left; }
    .nav-profile .name-row { justify-content: flex-start; }
    .cat-item { justify-content: flex-start; }
    .main { width: 100% !important; }
  }

  .main { width: 600px; flex-shrink: 0; padding: 40px 32px; }
  .back { color: var(--text-secondary); text-decoration: none; font-size: 14px; }
  .back:hover { color: var(--gold); }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    margin: 16px 0 24px;
  }
  h1 .dot { color: var(--gold); }

  .lock-box { text-align: center; padding: 60px 0; }
  input[type="password"] {
    width: 100%;
    max-width: 280px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    padding: 12px;
    outline: none;
    margin-bottom: 12px;
  }
  input[type="password"]:focus { border-color: var(--gold-dim); }
  button {
    padding: 11px 20px;
    background: var(--gold);
    color: #17171A;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #E08A42; }
  button:disabled { background: var(--gold-dim); cursor: not-allowed; }

  .post-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .post-tag { display: inline-block; font-size: 11px; color: var(--gold); border-left: 2px solid var(--gold); padding-left: 6px; margin-bottom: 8px; }
  .post-tag.column { color: #9C9A94; border-left-color: #6B6A65; }
  .post-tag.notice { color: #C48A6A; border-left-color: #8C5C42; }
  .post-tag.archive { color: #8FA8C4; border-left-color: #5C7A99; }
  .post-text { font-size: 14px; line-height: 1.6; white-space: pre-line; margin-bottom: 10px; }
  .post-footer { display: flex; justify-content: space-between; align-items: center; }
  .post-date { font-size: 12px; color: var(--text-muted); }
  .del-btn {
    background: transparent;
    color: var(--error);
    border: 1px solid var(--error);
    padding: 6px 14px;
    font-size: 13px;
  }
  .del-btn:hover { background: rgba(196,106,106,0.1); }
  .del-btn:disabled { opacity: 0.5; }
  .edit-btn {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    padding: 6px 14px;
    font-size: 13px;
    margin-right: 8px;
  }
  .edit-btn:hover { background: rgba(204,106,30,0.1); }

  .edit-form label { display: block; font-size: 12px; color: var(--text-secondary); margin: 12px 0 6px; }
  .edit-form select, .edit-form textarea, .edit-form input[type="file"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    padding: 10px;
    outline: none;
    box-sizing: border-box;
  }
  .edit-form textarea { min-height: 320px; resize: vertical; line-height: 1.7; }
  .edit-form-actions { display: flex; gap: 8px; margin-top: 14px; }
  .save-btn {
    background: var(--gold);
    color: #17171A;
    border: none;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
  }
  .save-btn:hover { background: #E08A42; }
  .cancel-btn {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 8px 16px;
    font-size: 13px;
  }
  .remove-image-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--text-secondary); }

  #manageArea { display: none; }
  .msg { margin: 12px 0; font-size: 13px; padding: 10px; border-radius: 8px; display: none; }
  .msg.error { display: block; background: rgba(196,106,106,0.1); color: var(--error); border: 1px solid var(--error); }
  .msg.success { display: block; background: rgba(198,161,91,0.12); color: var(--gold); border: 1px solid var(--gold-dim); }
</style>
</head>
<body>
<div class="layout">
  <!-- LEFT NAV (홈 화면과 동일한 틀) -->
  <div class="nav">
    <a href="index.html"><div class="nav-photo"><img src="logo.png" alt="WIN FUTURES"></div></a>
    <div class="nav-logo">WIN FUTURES ARCHIVE</div>
    <div class="nav-profile" id="profileArea"></div>
    <div class="nav-category" id="categoryArea"></div>
  </div>

  <div class="main">
    <a class="back" href="index.html">← 홈으로</a>
    <h1>WIN<span class="dot">·</span>FUTURES 글 관리</h1>

    <div class="lock-box" id="lockBox">
      <input type="password" id="managePassword" placeholder="비밀번호"><br>
      <button id="unlockBtn">확인</button>
      <div class="msg" id="lockMsg"></div>
    </div>

    <div id="manageArea">
      <div class="msg" id="actionMsg"></div>
      <div id="postList"></div>
    </div>
  </div>
</div>

<script>
  const CATEGORY_LABEL = { notice: '필독해주세요', community: '커뮤니티안내', review: '트레이딩리뷰', archive: '자료아카이브' };
  const CATEGORY_CLASS = { notice: 'notice', community: '', review: 'column', archive: 'archive' };
  let storedPassword = '';

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderBold(escapedText) {
    return escapedText.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function renderBio(text) {
    let escaped = escapeHtml(text);
    escaped = renderBold(escaped);
    escaped = escaped.replace(/(blog\.naver\.com\/[a-zA-Z0-9_-]+)/gi, (m) => `<a href="https://${m}" target="_blank">${m}</a>`);
    escaped = escaped.replace(/(카카오\s*(?:ID|아이디)\s*[:：]?\s*)([A-Za-z0-9_.\-]+)/gi, (m, label, id) => `${label}<span style="color:var(--gold);">${id}</span>`);
    return escaped;
  }
  function renderNavProfile(profile) {
    const el = document.getElementById('profileArea');
    el.innerHTML = `
      ${profile.badge ? `<div class="name-row"><span class="badge">${escapeHtml(profile.badge)}</span></div>` : ''}
      ${profile.handle ? `<div class="handle">${escapeHtml(profile.handle)}</div>` : ''}
      <div class="bio">${renderBio(profile.bio).replace(/\n/g, '<br>')}</div>
    `;
  }
  function renderNavCategory(posts) {
    const counts = { notice: 0, community: 0, review: 0, archive: 0 };
    posts.forEach(p => { if (counts[p.category] !== undefined) counts[p.category]++; });
    const el = document.getElementById('categoryArea');
    el.innerHTML = `
      <div class="nav-category-title">카테고리</div>
      <div class="cat-item"><span>전체</span><span class="cat-count">${posts.length}</span></div>
      <div class="cat-item"><span>필독해주세요</span><span class="cat-count">${counts.notice}</span></div>
      <div class="cat-item"><span>커뮤니티안내</span><span class="cat-count">${counts.community}</span></div>
      <div class="cat-item"><span>트레이딩리뷰</span><span class="cat-count">${counts.review}</span></div>
      <div class="cat-item"><span>자료아카이브</span><span class="cat-count">${counts.archive}</span></div>
    `;
  }
  fetch('./profile.json').then(r => r.json()).then(renderNavProfile).catch(() => {});

  let postsById = {};

  async function loadPosts() {
    const res = await fetch('./posts.json?_=' + Date.now());
    const posts = await res.json();
    posts.sort((a, b) => new Date(b.date) - new Date(a.date));
    postsById = {};
    posts.forEach(p => { postsById[p.id] = p; });
    renderNavCategory(posts);
    const list = document.getElementById('postList');
    if (posts.length === 0) {
      list.innerHTML = '<p style="color:var(--text-muted)">게시된 글이 없습니다.</p>';
      return;
    }
    list.innerHTML = posts.map(p => `
      <div class="post-item" data-id="${p.id}">
        <div class="view-mode">
          <div class="post-tag ${CATEGORY_CLASS[p.category] || ''}">${CATEGORY_LABEL[p.category] || p.category}</div>
          ${p.image ? `<img src="${p.image}" alt="첨부 이미지" style="width:100%;border-radius:6px;margin-bottom:8px;display:block;">` : ''}
          <div class="post-text">${renderBold(escapeHtml(p.content))}</div>
          <div class="post-footer">
            <span class="post-date">${new Date(p.date).toLocaleString('ko-KR')}${p.editedAt ? ' (수정됨)' : ''}</span>
            <span>
              <button class="edit-btn" onclick="openEdit('${p.id}')">수정</button>
              <button class="del-btn" onclick="deletePost('${p.id}', this)">삭제</button>
            </span>
          </div>
        </div>
        <div class="edit-form" id="edit-${p.id}" style="display:none;"></div>
      </div>
    `).join('');
  }

  function openEdit(id) {
    const p = postsById[id];
    const item = document.querySelector(`.post-item[data-id="${id}"]`);
    item.querySelector('.view-mode').style.display = 'none';
    const formEl = item.querySelector('.edit-form');
    formEl.style.display = 'block';
    formEl.innerHTML = `
      <label>카테고리</label>
      <select id="edit-cat-${id}">
        <option value="notice" ${p.category === 'notice' ? 'selected' : ''}>필독해주세요</option>
        <option value="community" ${p.category === 'community' ? 'selected' : ''}>커뮤니티안내</option>
        <option value="review" ${p.category === 'review' ? 'selected' : ''}>트레이딩리뷰</option>
        <option value="archive" ${p.category === 'archive' ? 'selected' : ''}>자료아카이브</option>
      </select>
      <label>내용</label>
      <textarea id="edit-content-${id}">${escapeHtml(p.content)}</textarea>
      ${p.image ? `
        <div class="remove-image-row">
          <input type="checkbox" id="edit-removeimg-${id}">
          <label for="edit-removeimg-${id}" style="margin:0;">기존 이미지 삭제</label>
        </div>
      ` : ''}
      <label>${p.image ? '이미지 교체 (선택)' : '이미지 첨부 (선택)'}</label>
      <input type="file" id="edit-image-${id}" accept="image/*">
      <div class="edit-form-actions">
        <button class="save-btn" onclick="saveEdit('${id}')">저장</button>
        <button class="cancel-btn" type="button" onclick="cancelEdit('${id}')">취소</button>
      </div>
      <div class="msg" id="edit-msg-${id}"></div>
    `;
  }

  function cancelEdit(id) {
    const item = document.querySelector(`.post-item[data-id="${id}"]`);
    item.querySelector('.edit-form').style.display = 'none';
    item.querySelector('.view-mode').style.display = 'block';
  }

  function compressImageFile(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const MAX_DIM = 1280;
          let w = img.width, h = img.height;
          if (w > h && w > MAX_DIM) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
          else if (h > MAX_DIM) { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function saveEdit(id) {
    const msg = document.getElementById(`edit-msg-${id}`);
    msg.className = 'msg';
    const category = document.getElementById(`edit-cat-${id}`).value;
    const content = document.getElementById(`edit-content-${id}`).value;
    const fileInput = document.getElementById(`edit-image-${id}`);
    const removeImgEl = document.getElementById(`edit-removeimg-${id}`);
    const removeImage = removeImgEl ? removeImgEl.checked : false;

    let imageData = null;
    if (fileInput.files[0]) {
      imageData = await compressImageFile(fileInput.files[0]);
    }

    try {
      const res = await fetch('/api/posts', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: storedPassword, id, category, content, imageData, removeImage })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '수정 실패');

      msg.textContent = data.message;
      msg.className = 'msg success';
      setTimeout(() => loadPosts(), 800);
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg error';
    }
  }

  async function deletePost(id, btn) {
    if (!confirm('이 글을 삭제하시겠습니까? 되돌릴 수 없습니다.')) return;
    btn.disabled = true;
    btn.textContent = '삭제 중...';
    const actionMsg = document.getElementById('actionMsg');
    actionMsg.className = 'msg';

    try {
      const res = await fetch('/api/posts', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: storedPassword, id })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '삭제 실패');

      actionMsg.textContent = data.message;
      actionMsg.className = 'msg success';
      btn.closest('.post-item').remove();
    } catch (err) {
      actionMsg.textContent = err.message;
      actionMsg.className = 'msg error';
      btn.disabled = false;
      btn.textContent = '삭제';
    }
  }

  document.getElementById('unlockBtn').addEventListener('click', async () => {
    const pw = document.getElementById('managePassword').value;
    if (!pw) return;
    storedPassword = pw;
    document.getElementById('lockBox').style.display = 'none';
    document.getElementById('manageArea').style.display = 'block';
    await loadPosts();

    const params = new URLSearchParams(window.location.search);
    const editId = params.get('edit');
    if (editId && postsById[editId]) {
      openEdit(editId);
      const target = document.querySelector(`.post-item[data-id="${editId}"]`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
</script>
</body>
</html>
